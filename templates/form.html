<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Time Prediction Form | Zomato</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #fff7ed 0%, #ffffff 50%, #fef2f2 100%);
        }
        
        .header-gradient {
            background: linear-gradient(135deg, #ea580c 0%, #dc2626 50%, #db2777 100%);
        }
        
        .form-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .input-field {
            transition: all 0.3s ease;
            border: 2px solid #e5e7eb;
        }
        
        .input-field:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
            outline: none;
        }
        
        .select-field {
            transition: all 0.3s ease;
            border: 2px solid #e5e7eb;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }
        
        .select-field:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
            outline: none;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #ea580c 0%, #dc2626 100%);
            transition: all 0.3s ease;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(220, 38, 38, 0.3);
        }
        
        .field-group {
            transition: all 0.3s ease;
        }
        
        .field-group:hover {
            transform: translateY(-2px);
        }
        
        .result-display {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        .floating-icon {
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <!-- Header -->
    <header class="header-gradient text-white relative overflow-hidden">
        <div class="absolute inset-0 bg-black bg-opacity-10"></div>
        <div class="relative z-10 px-6 py-12 text-center">
            <div class="max-w-4xl mx-auto">
                <div class="flex items-center justify-center mb-4">
                    <svg class="w-12 h-12 mr-4 floating-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                    <h1 class="text-3xl md:text-5xl font-bold tracking-tight">
                        Delivery Time Prediction
                    </h1>
                </div>
                <p class="text-lg text-orange-100">
                    Enter delivery details to get accurate time predictions
                </p>
            </div>
        </div>
    </header>

    <!-- Main Form -->
    <main class="container mx-auto px-6 py-12">
        <div class="max-w-6xl mx-auto">
            <form action="{{url_for('predict_datapoint')}}" method="POST" class="form-container rounded-2xl shadow-2xl p-8">
                
                <!-- Form Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                    
                    <!-- Delivery Person Age -->
                    <div class="field-group bg-white rounded-xl p-6 shadow-lg">
                        <label for="Delivery_person_Age" class="block text-sm font-semibold text-gray-700 mb-2">
                            <svg class="w-5 h-5 inline mr-2 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                            Delivery Person Age
                        </label>
                        <input type="number" id="Delivery_person_Age" name="Delivery_person_Age" 
                               class="input-field w-full px-4 py-3 rounded-lg" 
                               placeholder="Enter age (e.g., 25)" required>
                    </div>

                    <!-- Delivery Person Ratings -->
                    <div class="field-group bg-white rounded-xl p-6 shadow-lg">
                        <label for="Delivery_person_Ratings" class="block text-sm font-semibold text-gray-700 mb-2">
                            <svg class="w-5 h-5 inline mr-2 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                            </svg>
                            Delivery Person Rating
                        </label>
                        <input type="number" step="0.1" id="Delivery_person_Ratings" name="Delivery_person_Ratings" 
                               class="input-field w-full px-4 py-3 rounded-lg" 
                               placeholder="Enter rating (e.g., 4.5)" min="1" max="5" required>
                    </div>

                    <!-- Weather Conditions -->
                    <div class="field-group bg-white rounded-xl p-6 shadow-lg">
                        <label for="Weather_conditions" class="block text-sm font-semibold text-gray-700 mb-2">
                            <svg class="w-5 h-5 inline mr-2 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/>
                            </svg>
                            Weather Conditions
                        </label>
                        <select id="Weather_conditions" name="Weather_conditions" class="select-field w-full px-4 py-3 rounded-lg appearance-none" required>
                            <option value="">Select weather</option>
                            <option value="Sunny">☀️ Sunny</option>
                            <option value="Cloudy">☁️ Cloudy</option>
                            <option value="Fog">🌫️ Fog</option>
                            <option value="Windy">💨 Windy</option>
                            <option value="Sandstorms">🌪️ Sandstorms</option>
                            <option value="Stormy">⛈️ Stormy</option>
                        </select>
                    </div>

                    <!-- Road Traffic Density -->
                    <div class="field-group bg-white rounded-xl p-6 shadow-lg">
                        <label for="Road_traffic_density" class="block text-sm font-semibold text-gray-700 mb-2">
                            <svg class="w-5 h-5 inline mr-2 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            Road Traffic Density
                        </label>
                        <select id="Road_traffic_density" name="Road_traffic_density" class="select-field w-full px-4 py-3 rounded-lg appearance-none" required>
                            <option value="">Select traffic level</option>
                            <option value="Low">🟢 Low</option>
                            <option value="Medium">🟡 Medium</option>
                            <option value="High">🟠 High</option>
                            <option value="Jam">🔴 Jam</option>
                        </select>
                    </div>

                    <!-- Vehicle Condition -->
                    <div class="field-group bg-white rounded-xl p-6 shadow-lg">
                        <label for="Vehicle_condition" class="block text-sm font-semibold text-gray-700 mb-2">
                            <svg class="w-5 h-5 inline mr-2 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                            Vehicle Condition
                        </label>
                        <select id="Vehicle_condition" name="Vehicle_condition" class="select-field w-full px-4 py-3 rounded-lg appearance-none" required>
                            <option value="">Select condition</option>
                            <option value="0">Poor (0)</option>
                            <option value="1">Fair (1)</option>
                            <option value="2">Good (2)</option>
                            <option value="3">Excellent (3)</option>
                        </select>
                    </div>

                    <!-- Multiple Deliveries -->
                    <div class="field-group bg-white rounded-xl p-6 shadow-lg">
                        <label for="multiple_deliveries" class="block text-sm font-semibold text-gray-700 mb-2">
                            <svg class="w-5 h-5 inline mr-2 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                            </svg>
                            Multiple Deliveries
                        </label>
                        <select id="multiple_deliveries" name="multiple_deliveries" class="select-field w-full px-4 py-3 rounded-lg appearance-none" required>
                            <option value="">Select count</option>
                            <option value="0">None (0)</option>
                            <option value="1">Single (1)</option>
                            <option value="2">Double (2)</option>
                            <option value="3">Triple (3)</option>
                        </select>
                    </div>

                    <!-- Distance -->
                    <div class="field-group bg-white rounded-xl p-6 shadow-lg">
                        <label for="distance" class="block text-sm font-semibold text-gray-700 mb-2">
                            <svg class="w-5 h-5 inline mr-2 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                            Distance (km)
                        </label>
                        <input type="number" step="0.1" id="distance" name="distance" 
                               class="input-field w-full px-4 py-3 rounded-lg" 
                               placeholder="Enter distance (e.g., 5.2)" min="0" required>
                    </div>

                    <!-- Type of Order -->
                    <div class="field-group bg-white rounded-xl p-6 shadow-lg">
                        <label for="Type_of_order" class="block text-sm font-semibold text-gray-700 mb-2">
                            <svg class="w-5 h-5 inline mr-2 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                            </svg>
                            Type of Order
                        </label>
                        <select id="Type_of_order" name="Type_of_order" class="select-field w-full px-4 py-3 rounded-lg appearance-none" required>
                            <option value="">Select order type</option>
                            <option value="Drinks">🥤 Drinks</option>
                            <option value="Buffet">🍽️ Buffet</option>
                            <option value="Snack">🍿 Snack</option>
                            <option value="Meal">🍽️ Meal</option>
                        </select>
                    </div>

                    <!-- Type of Vehicle -->
                    <div class="field-group bg-white rounded-xl p-6 shadow-lg">
                        <label for="Type_of_vehicle" class="block text-sm font-semibold text-gray-700 mb-2">
                            <svg class="w-5 h-5 inline mr-2 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                            </svg>
                            Type of Vehicle
                        </label>
                        <select id="Type_of_vehicle" name="Type_of_vehicle" class="select-field w-full px-4 py-3 rounded-lg appearance-none" required>
                            <option value="">Select vehicle</option>
                            <option value="scooter">🛵 Scooter</option>
                            <option value="motorcycle">🏍️ Motorcycle</option>
                            <option value="electric_scooter">⚡ Electric Scooter</option>
                            <option value="bicycle">🚲 Bicycle</option>
                        </select>
                    </div>

                    <!-- Festival -->
                    <div class="field-group bg-white rounded-xl p-6 shadow-lg">
                        <label for="Festival" class="block text-sm font-semibold text-gray-700 mb-2">
                            <svg class="w-5 h-5 inline mr-2 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                            Festival Season
                        </label>
                        <select id="Festival" name="Festival" class="select-field w-full px-4 py-3 rounded-lg appearance-none" required>
                            <option value="">Select option</option>
                            <option value="Yes">🎉 Yes</option>
                            <option value="No">❌ No</option>
                        </select>
                    </div>

                    <!-- City -->
                    <div class="field-group bg-white rounded-xl p-6 shadow-lg">
                        <label for="City" class="block text-sm font-semibold text-gray-700 mb-2">
                            <svg class="w-5 h-5 inline mr-2 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                            </svg>
                            City Type
                        </label>
                        <select id="City" name="City" class="select-field w-full px-4 py-3 rounded-lg appearance-none" required>
                            <option value="">Select city type</option>
                            <option value="Metropolitian">🏙️ Metropolitan</option>
                            <option value="Urban">🏘️ Urban</option>
                            <option value="Semi-Urban">🏡 Semi-Urban</option>
                        </select>
                    </div>

                    <!-- Delivery Person City -->
                    <div class="field-group bg-white rounded-xl p-6 shadow-lg md:col-span-2 lg:col-span-3">
                        <label for="Delivery_person_City" class="block text-sm font-semibold text-gray-700 mb-2">
                            <svg class="w-5 h-5 inline mr-2 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                            </svg>
                            Delivery Person City
                        </label>
                        <select id="Delivery_person_City" name="Delivery_person_City" class="select-field w-full px-4 py-3 rounded-lg appearance-none" required>
                            <option value="">Select city</option>
                            <option value="DEH">Dehradun (DEH)</option>
                            <option value="KOC">Kochi (KOC)</option>
                            <option value="PUNE">Pune (PUNE)</option>
                            <option value="LUDH">Ludhiana (LUDH)</option>
                            <option value="KNP">Kanpur (KNP)</option>
                            <option value="MUM">Mumbai (MUM)</option>
                            <option value="MYS">Mysore (MYS)</option>
                            <option value="HYD">Hyderabad (HYD)</option>
                            <option value="KOL">Kolkata (KOL)</option>
                            <option value="RANCHI">Ranchi (RANCHI)</option>
                            <option value="COIMB">Coimbatore (COIMB)</option>
                            <option value="CHEN">Chennai (CHEN)</option>
                            <option value="JAP">Jaipur (JAP)</option>
                            <option value="SUR">Surat (SUR)</option>
                            <option value="BANG">Bangalore (BANG)</option>
                            <option value="GOA">Goa (GOA)</option>
                            <option value="AGR">Agra (AGR)</option>
                            <option value="ALH">Allahabad (ALH)</option>
                            <option value="VAD">Vadodara (VAD)</option>
                            <option value="AURG">Aurangabad (AURG)</option>
                            <option value="INDO">Indore (INDO)</option>
                            <option value="BHP">Bhopal (BHP)</option>
                        </select>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="text-center mb-8">
                    <button type="submit" class="submit-btn text-white font-bold py-4 px-12 rounded-xl text-xl shadow-lg">
                        <svg class="w-6 h-6 inline mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                        Predict Delivery Time
                    </button>
                </div>

                <!-- Result Display -->
                {% if final_result %}
                <div class="result-display text-white text-center py-6 px-8 rounded-xl shadow-lg">
                    <div class="flex items-center justify-center mb-4">
                        <svg class="w-12 h-12 mr-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <h2 class="text-3xl font-bold">Prediction Result</h2>
                    </div>
                    <p class="text-2xl font-semibold">
                        🚚 Delivery will arrive in <span class="text-4xl font-bold">{{final_result}}</span> minutes
                    </p>
                </div>
                {% endif %}
            </form>
        </div>
    </main>
</body>
</html>
